name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Rebuild daily so the Spotify section stays current without a commit. Note
  # GitHub disables cron workflows after 60 days of repository inactivity.
  schedule:
    - cron: '0 8 * * *'
  # Manual refresh, e.g. after rotating the Spotify secrets.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' 
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    # Rewrites src/content/spotify.generated.ts in the workspace only; the
    # committed snapshot is the fallback if Spotify is briefly unreachable.
    - name: Fetch Spotify top items
      run: node scripts/fetch-spotify.mjs
      env:
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

    - name: Build
      run: npm run build

    - name: Copy CNAME for custom domain
      run: cp CNAME dist/CNAME
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
